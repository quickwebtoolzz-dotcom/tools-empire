<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fix PDF Line Breaks Online</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>📄 PDF Text Cleaner</h1>
        <p>Paste messy PDF text here. We will instantly remove weird line breaks.</p>
        
        <textarea id="inputText" placeholder="Paste your messy PDF text here..."></textarea>
        <button onclick="cleanText()">Clean Text 🧹</button>
        <textarea id="outputText" placeholder="Your clean text will appear here..." readonly></textarea>
        <button id="copyBtn" onclick="copyText()" style="background-color: #28a745; display: none;">Copy to Clipboard 📋</button>
    </div>

    <!-- YOUR CUSTOM MINIGAME -->
    <div class="minigame">
        <p>Brain break! Stop the blue block exactly inside the green box.</p>
        <div id="game-container">
            <div id="target-box"></div>
            <div id="moving-box"></div>
        </div>
        <button id="pause-btn" onclick="toggleGame()">PAUSE</button>
        <p id="accuracy-text">Accuracy: 0%</p>
    </div>

    <script src="script.js"></script>
</body>
</html>
