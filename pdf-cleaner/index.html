<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fix PDF Line Breaks Online</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>📄 PDF Text Cleaner</h1>
        <p>Paste messy PDF text here. We will instantly remove weird line breaks and fix the paragraphs.</p>
        
        <textarea id="inputText" placeholder="Paste your messy PDF text here..."></textarea>
        
        <button onclick="cleanText()">Clean Text 🧹</button>
        
        <textarea id="outputText" placeholder="Your clean text will appear here..." readonly></textarea>
        
        <button id="copyBtn" onclick="copyText()" style="background-color: #28a745; display: none;">Copy to Clipboard 📋</button>
    </div>

    <!-- Dwell-Time Minigame -->
    <div class="minigame">
        <p>Brain break! Catch the dot!</p>
        <div id="game-area">
            <div id="dot" onclick="catchDot()"></div>
        </div>
        <p id="score-text">Score: 0</p>
    </div>

    <script src="script.js"></script>
</body>
</html>
