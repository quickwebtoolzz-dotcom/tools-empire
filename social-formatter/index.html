<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram & LinkedIn Line Break Formatter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>🌊 Social Media Formatter</h1>
        <p>Write your caption below. We will add invisible spaces so Instagram and LinkedIn don't ruin your paragraphs!</p>
        
        <textarea id="input-text" placeholder="Write your caption here... Make sure to leave empty lines between paragraphs!"></textarea>
        
        <button onclick="formatAndCopy()">Format & Copy Text ✨</button>
        <p id="success-msg">Copied to clipboard!</p>
    </div>

    <script src="script.js"></script>
</body>
</html>
