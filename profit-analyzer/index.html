<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Business Profit Margin & ROI Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="dashboard">
        <div class="header">
            <h1>📊 Executive Profit Analyzer</h1>
            <p>Calculate your Margins, ROI, and Break-Even point instantly.</p>
            <select id="currency" style="padding: 5px; background: #1a1f24; color: white; border: 1px solid #393e46; border-radius: 4px; outline: none;">
                    <option value="$">USD - US Dollar ($)</option>
                    <option value="€">EUR - Euro (€)</option>
                    <option value="₹">INR - Indian Rupee (₹)</option>
                    <option value="£">GBP - British Pound (£)</option>
                    <option value="A$">AUD - Australian Dollar (A$)</option>
                    <option value="C$">CAD - Canadian Dollar (C$)</option>
                    <option value="¥">JPY - Japanese Yen (¥)</option>
                    <option value="¥">CNY - Chinese Yuan (¥)</option>
                    <option value="R$">BRL - Brazilian Real (R$)</option>
                    <option value="₱">PHP - Philippine Peso (₱)</option>
                    <option value="Rp">IDR - Indonesian Rupiah (Rp)</option>
                    <option value="₦">NGN - Nigerian Naira (₦)</option>
                    <option value="R">ZAR - South African Rand (R)</option>
                    <option value="د.إ">AED - UAE Dirham (د.إ)</option>
                    <option value="SAR">SAR - Saudi Riyal (SAR)</option>
                    <option value="RM">MYR - Malaysian Ringgit (RM)</option>
                    <option value="฿">THB - Thai Baht (฿)</option>
                    <option value="kr">SEK/NOK/DKK - Krone (kr)</option>
                    <option value="₩">KRW - South Korean Won (₩)</option>
                    <option value="₪">ILS - Israeli Shekel (₪)</option>
                    <option value="₽">RUB - Russian Ruble (₽)</option>
                    <option value="₺">TRY - Turkish Lira (₺)</option>
                    <option value="Mex$">MXN - Mexican Peso (Mex$)</option>
                    <option value="Ksh">KES - Kenyan Shilling (Ksh)</option>
                    <option value="৳">BDT - Bangladeshi Taka (৳)</option>
                    <option value="Rs">PKR/LKR - Rupee (Rs)</option>
                    <option value="">None (Just numbers)</option>
                </select>
                    
            </div>
        </div>

        <div class="grid-layout">
            <!-- MODULE 1: PROFIT MARGIN -->
            <div class="module">
                <h2>1. Profit Margin</h2>
                <label>Cost to Produce/Buy</label>
                <input type="number" id="cost" placeholder="e.g. 25">
                
                <label>Selling Price</label>
                <input type="number" id="price" placeholder="e.g. 100">
                
                <button onclick="calcMargin()">Calculate Margin</button>
                
                <div class="result-box">
                    <p>Gross Profit: <span id="gross-profit" class="money">0.00</span></p>
                    <p>Profit Margin: <span id="margin-percent" class="highlight">0%</span></p>
                </div>
            </div>

            <!-- MODULE 2: MARKETING ROI -->
            <div class="module">
                <h2>2. Marketing ROI</h2>
                <label>Total Ad Spend</label>
                <input type="number" id="ad-spend" placeholder="e.g. 500">
                
                <label>Revenue from Ads</label>
                <input type="number" id="ad-rev" placeholder="e.g. 2000">
                
                <button onclick="calcROI()">Calculate ROI</button>
                
                <div class="result-box">
                    <p>Return on Investment: <span id="roi-percent" class="highlight">0%</span></p>
                </div>
            </div>
        </div>

        <!-- MODULE 3: BREAK-EVEN -->
        <div class="module full-width">
            <h2>3. Break-Even Point</h2>
            <div class="inline-inputs">
                <div>
                    <label>Fixed Business Costs</label>
                    <input type="number" id="fixed-costs" placeholder="e.g. 1000">
                </div>
                <div>
                    <label>Profit per Sale</label>
                    <input type="number" id="profit-per-sale" placeholder="e.g. 75">
                </div>
            </div>
            <button onclick="calcBreakEven()">Calculate Break-Even</button>
            <div class="result-box center-text">
                <p>You need to sell <span id="breakeven-units" class="highlight">0</span> units to break even.</p>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
